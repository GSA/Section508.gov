<div
  class="usa-form-group"
  [ngClass]="{ 'usa-form-group--error': displayError() }"
  [hidden]="hidden"
  >
  <div class="margin-bottom-0">
    <h3 [id]="$safeNavigationMigration(formData?.controlName)">{{ formData?.title }}</h3>
  </div>
  @if (formData?.label) {
    <label
      class="usa-label"
      [for]="'input' + $safeNavigationMigration(formData?.controlName)"
      >{{ formData?.label }}</label
      >
    }
    @if (formData?.description) {
      <span
        class="usa-checkbox__label-description usa-hint"
        >{{ formData?.description }}</span
        >
      }
      @if (displayError()) {
        <span
          class="usa-error-message"
          role="alert"
          for="input-error"
          >{{ displayError() }}</span
          >
        }
        <input
          [maxlength]="maxLength"
          [name]="$safeNavigationMigration(formData?.controlName)"
          class="usa-input"
          [ngClass]="{ 'usa-input--error': displayError() }"
          autocomplete="off"
          [id]="'input' + $safeNavigationMigration(formData?.controlName)"
    [attr.aria-label]="
      formData?.ariaLabel
        ? formData?.ariaLabel
        : formData?.title + ' ' + fromControl.value
    "
          [placeholder]="$safeNavigationMigration(formData?.placeholder)"
          name="input"
          [formControl]="fromControl"
          (focusout)="onBlur($event, $safeNavigationMigration(formData?.controlName), $safeNavigationMigration(formData?.errorMessages))"
          />
        </div>
